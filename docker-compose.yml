services:
  ai-tool:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-tool
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "54350:3000"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      paddle-ocr:
        condition: service_healthy

  paddle-ocr:
    build:
      context: ./server_ocr
      dockerfile: Dockerfile
    container_name: paddle-ocr
    env_file:
      - .env
    environment:
      OCR_HOST: 0.0.0.0
      OCR_PORT: 8000
      OCR_WORKERS: 1
      OCR_MAX_CONCURRENT: 4
      OCR_THREAD_WORKERS: 4
      OCR_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./server_ocr/models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
